name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: |
          pip install --upgrade pip
          # GIS 패키지(geopandas 등)는 GDAL 시스템 라이브러리 필요 → CI에서는 제외
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
          ruff check scripts/validate_e7r_mapping.py tests/test_validate_e7r_mapping.py
          ruff format --check scripts/validate_e7r_mapping.py tests/test_validate_e7r_mapping.py
          ruff check \
            scripts/schema_v2.py \
            scripts/migrate_to_v2.py \
            scripts/validate_common_schema_v2.py \
            scripts/validate_source_record_mappings.py
          ruff format --check \
            scripts/schema_v2.py \
            scripts/migrate_to_v2.py \
            scripts/validate_common_schema_v2.py \
            scripts/validate_source_record_mappings.py

      - name: 테스트 실행
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: E-7-4R 매핑 무결성 검증
        run: python scripts/validate_e7r_mapping.py

      - name: 공통 스키마 v2 검증
        run: |
          python scripts/validate_common_schema_v2.py \
            --baseline extraction/common_v2/known_validation_gaps.txt

      - name: 공통 스키마 v2 원천 매핑 검증
        run: python scripts/validate_source_record_mappings.py
