name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 의존성 설치
        run: |
          pip install --upgrade pip
          # GIS 패키지(geopandas 등)는 GDAL 시스템 라이브러리 필요 → CI에서는 제외
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
          ruff check scripts/validate_e7r_mapping.py tests/test_validate_e7r_mapping.py
          ruff format --check scripts/validate_e7r_mapping.py tests/test_validate_e7r_mapping.py
          ruff check \
            scripts/schema_v2.py \
            scripts/migrate_to_v2.py \
            scripts/validate_common_schema_v2.py \
            scripts/validate_source_record_mappings.py \
            scripts/import_common_v2.py \
            scripts/reference_schema.py \
            scripts/migrate_agency_contacts_map_columns.py \
            scripts/import_reference_data.py \
            scripts/validate_fk_integrity.py
          ruff format --check \
            scripts/schema_v2.py \
            scripts/migrate_to_v2.py \
            scripts/validate_common_schema_v2.py \
            scripts/validate_source_record_mappings.py \
            scripts/import_common_v2.py \
            scripts/reference_schema.py \
            scripts/migrate_agency_contacts_map_columns.py \
            scripts/import_reference_data.py \
            scripts/validate_fk_integrity.py

      - name: 테스트 실행
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

      - name: E-7-4R 매핑 무결성 검증
        run: python scripts/validate_e7r_mapping.py

      - name: reference/ FK·지도 컬럼 무결성 검증
        run: python scripts/validate_fk_integrity.py

      - name: reference importer dry-run
        run: python scripts/import_reference_data.py

      - name: 공통 스키마 v2 검증
        run: |
          python scripts/validate_common_schema_v2.py \
            --baseline extraction/common_v2/known_validation_gaps.txt

      - name: 공통 스키마 v2 원천 매핑 검증
        run: python scripts/validate_source_record_mappings.py

      - name: Supabase importer dry-run
        run: python scripts/import_common_v2.py

  migration-import-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e .
      - name: Apply migration
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260826000000_common_schema_v2.sql
      - name: Apply reference migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260827000000_reference_agency_map_schema.sql
      - name: Import twice and verify idempotency
        run: |
          python scripts/import_common_v2.py --apply
          python scripts/import_common_v2.py --apply
      - name: Import reference data twice and verify idempotency
        run: |
          python scripts/import_reference_data.py --apply
          python scripts/import_reference_data.py --apply
